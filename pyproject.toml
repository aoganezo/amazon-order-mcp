[project]
name = "amazon-order-mcp"
version = "0.1.0"
description = "MCP server wrapper for amazon-orders library"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==1.30.0",
    "amazon-orders==4.10.0",
    "python-dotenv==1.2.4",
    "nest-asyncio==1.6.0",
]

[project.scripts]
amazon-order-mcp = "amazon_order_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Supply-chain cooldown: ignore anything published to PyPI after this date.
# Bump deliberately (and re-review) when you want to upgrade.
exclude-newer = "2026-10-22T00:00:00Z"
